name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    # 支持 [skip ci] 跳过
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取提交哈希
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 运行测试
        run: bun test --bail

      - name: 运行 lint
        run: bun run lint --quiet

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: 构建
        run: bun run build

      - name: 设置测试版本号
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DEV_VERSION="${VERSION}-dev.${SHORT_SHA}"
          npm version $DEV_VERSION --no-git-tag-version
          echo "DEV_VERSION=$DEV_VERSION" >> $GITHUB_ENV

      - name: 发布到 npm (next tag)
        run: npm publish --provenance --access public --tag next

      - name: 发布成功
        run: |
          echo "## ✅ 测试版本发布成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "版本: \`${{ env.DEV_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "安装命令:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install dg-lab-mcp@next" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
