name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    # 支持 [skip ci] 跳过
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 运行测试
        run: bun test --bail --reporter=compact

      - name: 运行 lint
        run: bun run lint --quiet

    outputs:
      short_sha: ${{ steps.get_sha.outputs.short_sha }}

  # 获取 commit hash
  get-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      dev_version: ${{ steps.version.outputs.dev_version }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 计算版本号
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(node -p "require('./package.json').version")
          DEV_VERSION="${VERSION}-dev.${SHORT_SHA}"
          echo "dev_version=$DEV_VERSION" >> $GITHUB_OUTPUT

  # 调用可复用发布工作流
  publish:
    needs: [test, get-version]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    uses: ./.github/workflows/publish.yml
    with:
      tag: next
      version: ${{ needs.get-version.outputs.dev_version }}

  # 发布成功通知
  notify:
    runs-on: ubuntu-latest
    needs: [publish, get-version]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: 发布成功
        run: |
          echo "## ✅ 测试版本发布成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "版本: \`${{ needs.get-version.outputs.dev_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "安装命令:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install dg-lab-mcp@next" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
