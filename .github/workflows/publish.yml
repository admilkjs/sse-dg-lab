# 统一发布入口点 - 在 npm 上注册此文件为 Trusted Publisher
name: Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ========== Release Please（仅 push 时运行）==========
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    steps:
      - name: 🚀 运行 release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # ========== 获取版本号 ==========
  get-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 计算版本号
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(node -p "require('./package.json').version")
          
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # PR 版本: x.x.x-pr.{PR_NUMBER}.{SHORT_SHA}
            PR_NUMBER=${{ github.event.pull_request.number }}
            FULL_VERSION="${VERSION}-pr.${PR_NUMBER}.${SHORT_SHA}"
            TAG="pr"
          else
            # push 版本: x.x.x-dev.{SHORT_SHA}
            FULL_VERSION="${VERSION}-dev.${SHORT_SHA}"
            TAG="next"
          fi
          
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  # ========== 运行测试 ==========
  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 运行测试
        run: bun test --bail --reporter=dots

      - name: 运行 lint
        run: bun run lint --quiet

      - name: 类型检查
        if: github.event_name == 'pull_request'
        run: bun run typecheck

      - name: 构建检查
        if: github.event_name == 'pull_request'
        run: bun run build

  # ========== 发布正式版本（仅当 release-please 创建了 release）==========
  publish-stable:
    runs-on: ubuntu-latest
    needs: [release-please, test]
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Build package
        run: bun run build

      - name: Publish to npm (latest)
        run: npm publish --provenance --access public

      - name: 发布成功
        run: |
          echo "## ✅ 正式版本发布成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本:** \`${{ needs.release-please.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**npm:** https://www.npmjs.com/package/dg-lab-mcp/v/${{ needs.release-please.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**安装命令:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install dg-lab-mcp@${{ needs.release-please.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "# 或" >> $GITHUB_STEP_SUMMARY
          echo "npm install dg-lab-mcp@latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ========== 发布 dev 版本（push 且没有正式发布时）==========
  publish-dev:
    runs-on: ubuntu-latest
    needs: [release-please, test, get-version]
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created != 'true' && !contains(github.event.head_commit.message || '', '[skip ci]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Build package
        run: bun run build

      - name: Set dev version
        run: npm version ${{ needs.get-version.outputs.version }} --no-git-tag-version

      - name: Publish to npm (next)
        run: npm publish --provenance --access public --tag next

      - name: 发布成功
        run: |
          echo "## ✅ 测试版本发布成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本:** \`${{ needs.get-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**npm:** https://www.npmjs.com/package/dg-lab-mcp/v/${{ needs.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**安装命令:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install dg-lab-mcp@${{ needs.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "# 或使用 next 标签安装最新测试版" >> $GITHUB_STEP_SUMMARY
          echo "npm install dg-lab-mcp@next" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ========== 发布 PR 版本 ==========
  publish-pr:
    runs-on: ubuntu-latest
    needs: [test, get-version]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Build package
        run: bun run build

      - name: Set PR version
        run: npm version ${{ needs.get-version.outputs.version }} --no-git-tag-version

      - name: Publish to npm (pr tag)
        run: npm publish --provenance --access public --tag pr

      - name: 发布成功
        run: |
          echo "## ✅ PR 测试版本发布成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本:** \`${{ needs.get-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**npm:** https://www.npmjs.com/package/dg-lab-mcp/v/${{ needs.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**安装命令:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install dg-lab-mcp@${{ needs.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "# 或使用 pr 标签安装最新 PR 版本" >> $GITHUB_STEP_SUMMARY
          echo "npm install dg-lab-mcp@pr" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 评论 PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## ✅ PR 测试版本已发布
            
            **版本:** `${{ needs.get-version.outputs.version }}`
            
            **安装命令:**
            ```bash
            npm install dg-lab-mcp@${{ needs.get-version.outputs.version }}
            # 或
            npm install dg-lab-mcp@pr
            ```
            
            > 📦 [npm package](https://www.npmjs.com/package/dg-lab-mcp/v/${{ needs.get-version.outputs.version }})
          comment-tag: pr-publish
          mode: recreate
