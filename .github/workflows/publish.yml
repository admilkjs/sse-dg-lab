# 统一发布入口点 - 在 npm 上注册此文件为 Trusted Publisher
name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ========== Release Please（检查是否有正式发布）==========
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    steps:
      - name: 🚀 运行 release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # ========== 获取 dev 版本号 ==========
  get-dev-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      dev_version: ${{ steps.version.outputs.dev_version }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 计算版本号
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(node -p "require('./package.json').version")
          DEV_VERSION="${VERSION}-dev.${SHORT_SHA}"
          echo "dev_version=$DEV_VERSION" >> $GITHUB_OUTPUT

  # ========== 运行测试 ==========
  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 运行测试
        run: bun test --bail --reporter=dots

      - name: 运行 lint
        run: bun run lint --quiet

  # ========== 发布正式版本（仅当 release-please 创建了 release）==========
  publish-stable:
    runs-on: ubuntu-latest
    needs: [release-please, test]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Build package
        run: bun run build

      - name: Publish to npm (latest)
        run: npm publish --provenance --access public

      - name: 发布成功
        run: |
          echo "## ✅ 正式版本发布成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "版本: \`${{ needs.release-please.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "安装命令:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install dg-lab-mcp@latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ========== 发布 dev 版本（当没有正式发布时）==========
  publish-dev:
    runs-on: ubuntu-latest
    needs: [release-please, test, get-dev-version]
    if: ${{ needs.release-please.outputs.release_created != 'true' && !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Build package
        run: bun run build

      - name: Set dev version
        run: npm version ${{ needs.get-dev-version.outputs.dev_version }} --no-git-tag-version

      - name: Publish to npm (next)
        run: npm publish --provenance --access public --tag next

      - name: 发布成功
        run: |
          echo "## ✅ 测试版本发布成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "版本: \`${{ needs.get-dev-version.outputs.dev_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "安装命令:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install dg-lab-mcp@next" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
