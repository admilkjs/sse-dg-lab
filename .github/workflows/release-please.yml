name: Release Please

# 当推送到 main 分支时触发
on:
  push:
    branches:
      - main

# 需要的权限
permissions:
  contents: write
  pull-requests: write
  id-token: write # 用于 npm OIDC 可信发布

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 运行 release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Setup Bun
        if: ${{ steps.release.outputs.release_created }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: bun install

      - name: Run tests
        if: ${{ steps.release.outputs.release_created }}
        run: bun test --bail

      - name: Run linting
        if: ${{ steps.release.outputs.release_created }}
        run: bun run lint --quiet

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Build package
        if: ${{ steps.release.outputs.release_created }}
        run: bun run build

      # 使用 OIDC 可信发布 (无需 token)
      # 需要先在 npmjs.com 包设置中配置 GitHub Actions 作为可信发布者:
      # 1. 去 npmjs.com -> 包页面 -> Settings -> Trusted Publisher
      # 2. 选择 GitHub Actions
      # 3. 填写: Repository owner: admilkjs, Repository name: sse-dg-lab
      # 4. Workflow filename: release-please.yml
      # 5. Environment: (留空)
      - name: Publish to npm (OIDC)
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish --provenance --access public

      - name: Publish success
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "✅ Successfully published dg-lab-mcp@${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }} to npm"
