name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 运行测试
        run: bun test --bail --reporter=compact

      - name: 运行 lint
        run: bun run lint --quiet

      - name: 类型检查
        run: bun run typecheck

      - name: 构建检查
        run: bun run build

      - name: 测试通过
        run: |
          echo "## ✅ 所有检查通过" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 测试通过" >> $GITHUB_STEP_SUMMARY
          echo "- Lint 通过" >> $GITHUB_STEP_SUMMARY
          echo "- 类型检查通过" >> $GITHUB_STEP_SUMMARY
          echo "- 构建成功" >> $GITHUB_STEP_SUMMARY

      - name: 评论 PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## ✅ CI 检查通过
            
            合并后将自动发布测试版本，安装命令：
            ```bash
            npm install dg-lab-mcp@next
            ```
          comment-tag: ci-status
          mode: recreate
